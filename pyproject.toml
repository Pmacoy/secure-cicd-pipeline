[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "C90"]
# S101: assert is expected/fine in the test suite.
per-file-ignores = { "tests/*" = ["S101"] }

[tool.ruff.lint.mccabe]
# The Flask app-factory pattern (routes as closures inside create_app)
# trips the default threshold of 10 without actually being hard to follow;
# 15 still catches genuinely tangled functions.
max-complexity = 15

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ has no __init__.py, so pytest's default rootdir-insertion only adds
# tests/ itself to sys.path, not the repo root — "app" stays unimportable
# without this. (My own local validation used a hand-rolled runner that
# added the repo root to sys.path directly, which is why this gap didn't
# show up until real pytest ran in CI.)
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
