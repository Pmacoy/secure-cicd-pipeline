version: 2
updates:
  - package-ecosystem: pip
    directory: / # requirements-dev.txt (test/lint/scan tooling)
    schedule:
      interval: weekly
    # A newly-published package version is a bigger supply-chain risk than
    # an established one — a compromised release is usually caught and
    # pulled within days. Waiting out a cooldown before proposing it is
    # cheap insurance (this is also what Semgrep's default ruleset checks
    # for, so it's enforced twice: here and in security.yml).
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /app # app/requirements.txt (runtime deps shipped in the image)
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, ci]
