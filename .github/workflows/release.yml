name: Release

# Deliberately push-to-main only, not pull_request: this is the CD half of
# the pipeline. Branch protection (see README) is what actually keeps
# broken/unscanned code off main — by the time this runs, ci.yml and
# security.yml have already passed as required status checks on the PR.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false # never cancel a release mid-deploy

jobs:
  build-and-scan:
    name: Build & scan image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # github.repository preserves the exact case of the GitHub username
      # ("Pmacoy"), but GHCR (like every OCI/Docker registry) requires an
      # all-lowercase repository path — a plain mixed-case reference
      # doesn't even parse, let alone resolve. `docker/build-push-action`
      # apparently normalizes this itself when pushing (see the publish
      # job below), which is what let a mixed-case push through silently
      # while syft, cosign and a plain `docker pull` all rejected the
      # unmodified value outright. Lowercasing it once, here, and passing
      # it to every job downstream avoids relying on any one tool's
      # implicit normalization.
      - id: image
        name: Compute lowercase image name (GHCR requirement)
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: local/shrtn:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: local/shrtn:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true # a CVE with no available fix yet isn't actionable — don't block the pipeline on it
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload scan results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: trivy-image-results.sarif

  publish:
    name: Publish to GHCR (signed, with SBOM)
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via OIDC — no long-lived key in this repo at all
    env:
      IMAGE_NAME: ${{ needs.build-and-scan.outputs.image_name }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ needs.build-and-scan.outputs.image_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: shrtn.spdx.json

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign image (keyless, via GitHub OIDC)
        run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Attest SBOM to the image
        run: |
          cosign attest --yes \
            --predicate shrtn.spdx.json \
            --type spdx \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}

  deploy-staging:
    name: Deploy to staging (gated)
    needs: publish
    runs-on: ubuntu-latest
    # This is the point of a GitHub Environment: "staging" can carry
    # required-reviewer protection rules configured in the repo settings, so
    # this job literally cannot run until someone approves it — the same
    # mechanism you'd use to gate a real production deploy.
    environment:
      name: staging
    steps:
      - name: Pull the image that was just signed and scanned
        run: docker pull "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}

      - name: Run it and smoke-test /healthz
        run: |
          set -euo pipefail
          docker run -d --name shrtn-staging -p 8080:8080 \
            "${IMAGE}@${DIGEST}"

          for i in $(seq 1 15); do
            if curl -fs http://localhost:8080/healthz; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done

          echo "::error::staging container never became healthy"
          docker logs shrtn-staging
          exit 1
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed to staging :rocket:"
            echo ""
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Signed with cosign (keyless) and attested with an SPDX SBOM"
            echo ""
            echo "This job stands in for a real deploy target (a \`kubectl set"
            echo "image\`, \`helm upgrade\`, or \`aws ecs update-service\` call"
            echo "would replace the run+smoke-test step above) — the point"
            echo "demonstrated here is the *gate*: this job only ran because"
            echo "the \`staging\` environment's required reviewers approved it."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
