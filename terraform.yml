name: Terraform

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - "bootstrap/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - "bootstrap/**"

jobs:
  fmt:
    name: terraform fmt -check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -recursive -check -diff

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/aws/networking
          - modules/aws/iam
          - modules/aws/logging
          - modules/azure/networking
          - modules/azure/iam
          - modules/azure/logging
          - environments/aws
          - environments/azure
          - bootstrap/aws
          - bootstrap/azure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      # -backend=false: this job only checks that the HCL is syntactically
      # valid and that every resource/attribute matches the provider schema —
      # it never touches real cloud state or credentials.
      - working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false
          terraform validate

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive
