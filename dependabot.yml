version: 2
updates:
  - package-ecosystem: pip
    directory: / # requirements-dev.txt (test/lint/scan tooling)
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]

  - package-ecosystem: pip
    directory: /app # app/requirements.txt (runtime deps shipped in the image)
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, ci]
